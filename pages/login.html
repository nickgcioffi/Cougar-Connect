<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in · Cougar Connect</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="page-loading">
    <header class="landing-header auth-header">
      <a class="brand" href="/"
        ><img
          class="mark"
          src="/assets/byu-logo.png"
          alt="BYU"
          width="62"
          height="40"
        />
        cougar<span class="light">connect</span></a>
      <span class="demo">BYU EVENTS · STUDENT PROTOTYPE</span>
    </header>
    <main>
      <div class="setup">
        <aside class="intro">
          <div>
            <div class="eyebrow">YOUR CAMPUS. YOUR NEXT CHAPTER.</div>
            <h1>Good things<br />happen when<br />you show up.</h1>
            <p>
              Discover the people, experiences, and opportunities that make your
              time at BYU count.
            </p>
          </div>
          <div class="introFoot">
            A connection today.<br />A possibility for tomorrow.
          </div>
        </aside>
        <section class="formside">
          <h2 id="authTitle">Welcome to Cougar Connect</h2>
          <form id="authForm">
            <label id="emailLabel"
              >Email<input
                name="email"
                type="email"
                autocomplete="email"
                required /></label
            ><label
              >Password<input
                name="password"
                type="password"
                autocomplete="current-password"
                minlength="8"
                required /></label
            ><button class="primary wide" name="action" value="login">
              Sign in</button
            ><button type="button" id="createAccount" class="wide">
              Create account
            </button>
          </form>
          <button
          type="button"
          id="resetPassword"
          class="forgot-password-link"
        >
          Forgot password?
        </button>
          <a class="auth-card-back" href="/">← Back to home</a>
        </section>
      </div>
    </main>
    <div id="toast" role="status"></div>
    <script src="/js/vendor/supabase.js"></script>
    <script type="module" src="/js/pages/login.js"></script>
  </body>
</html>
