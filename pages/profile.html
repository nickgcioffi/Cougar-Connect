<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Profile · Cougar Connect</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="page-loading">
    <header>
      <a class="brand" href="/home"
        ><img
          class="mark"
          src="/assets/byu-logo.png"
          alt="BYU"
          width="62"
          height="40"
        />
        cougar<span class="light">connect</span></a
      ><span class="demo">PROFILE SETUP</span>
    </header>
    <main>
      <div class="setup" id="profileLayout">
        <aside class="intro">
          <div>
            <div class="eyebrow">YOUR CAMPUS. YOUR NEXT CHAPTER.</div>
            <h1>Good things<br />happen when<br />you show up.</h1>
            <p>Start with a little about you.</p>
          </div>
        </aside>
        <section class="formside">
          <div class="eyebrow">STEP 01 / 02</div>
          <h2 id="profileHeading">Make yourself at home.</h2>
          <form id="profileForm">
            <div class="upload">
              <img
                class="avatar"
                id="avatarPreview"
                alt="Profile photo"
                hidden
              /><span class="avatar" id="avatarPlaceholder">＋</span
              ><label
                >Profile photo <span class="subtle">(optional)</span
                ><input id="photo" type="file" accept="image/*"
              /></label>
            </div>
            <label>Full name<input name="name" required maxlength="80" /></label
            ><label
              >University<select name="uni">
                <option>Brigham Young University</option>
                <option>BYU–Idaho</option>
                <option>BYU–Hawaii</option>
                <option>Other</option>
              </select></label
            >
            <label
              >Study level<select name="level">
                <option>Undergraduate</option>
                <option>Graduate</option>
              </select></label
            >
            <fieldset class="graduation-date">
              <legend>Graduation date</legend>
              <div class="row">
                <label
                  >Month<select name="graduationMonth" required>
                    <option value="">Select month</option>
                    <option value="01">January</option>
                    <option value="02">February</option>
                    <option value="03">March</option>
                    <option value="04">April</option>
                    <option value="05">May</option>
                    <option value="06">June</option>
                    <option value="07">July</option>
                    <option value="08">August</option>
                    <option value="09">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                  </select></label
                >
                <label
                  >Year<input
                    name="graduationYear"
                    type="text"
                    inputmode="numeric"
                    pattern="(?!0000)[0-9]{4}"
                    maxlength="4"
                    placeholder="e.g. 2027"
                    title="Enter a four-digit year, such as 2027"
                    required
                /></label>
              </div>
            </fieldset>
            <label
              >Bio <span class="subtle">(optional)</span
              ><textarea name="bio" maxlength="400"></textarea></label
            ><button class="primary wide">Save profile →</button>
            <p id="cancelEdit" hidden><a href="/settings">Cancel</a></p>
          </form>
        </section>
      </div>
    </main>
    <div id="toast" role="status"></div>
    <script src="/js/vendor/supabase.js"></script>
    <script type="module" src="/js/pages/profile.js"></script>
  </body>
</html>
