<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="cc-view" content="mobile" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <script defer src="/js/shared/view-routing.js"></script>
    <title>Profile · Cougar Connect</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/mobile.css" />
  </head>
  <body data-mobile="true" class="page-loading">
    <header>
      <a class="brand" href="/home"
        ><img
          class="mark"
          src="/assets/byu-logo.png"
          alt="BYU"
          width="62"
          height="40"
        />
        cougar<span class="light">connect</span></a
      ><span class="demo">PROFILE SETUP</span>
    </header>
    <main>
      <div class="setup" id="profileLayout">
        <aside class="intro">
          <div>
            <div class="eyebrow">YOUR CAMPUS. YOUR NEXT CHAPTER.</div>
            <h1>Good things<br />happen when<br />you show up.</h1>
            <p>Start with a little about you.</p>
          </div>
        </aside>
        <section class="formside">
          <div class="eyebrow">STEP 01 / 02</div>
          <h2 id="profileHeading">Make yourself at home.</h2>
          <form id="profileForm">
            <div class="upload">
              <img
                class="avatar"
                id="avatarPreview"
                alt="Profile photo"
                hidden
              /><span class="avatar" id="avatarPlaceholder">＋</span
              ><label
                >Profile photo <span class="subtle">(optional)</span
                ><input id="photo" type="file" accept="image/*"
              /></label>
            </div>
            <label>Full name<input name="name" required maxlength="80" /></label
            ><label
              >University<select name="uni">
                <option>Brigham Young University</option>
                <option>BYU–Idaho</option>
                <option>BYU–Hawaii</option>
                <option>Other</option>
              </select></label
            >
            <label
              >Study level<select name="level">
                <option>Undergraduate</option>
                <option>Graduate</option>
              </select></label
            >
            <fieldset class="graduation-date">
              <legend>Graduation date</legend>
              <label>
                <select name="graduationYear" aria-label="Graduation year" required>
                  <option value="">Select year</option>
                </select>
              </label>
              <div class="graduation-months" role="group" aria-label="Month">
                <label class="graduation-month">
                  <input type="radio" name="graduationMonth" value="01" aria-label="January" required />
                  <span>Jan</span>
                </label>
                <label class="graduation-month">
                  <input type="radio" name="graduationMonth" value="02" aria-label="February" required />
                  <span>Feb</span>
                </label>
                <label class="graduation-month">
                  <input type="radio" name="graduationMonth" value="03" aria-label="March" required />
                  <span>Mar</span>
                </label>
                <label class="graduation-month">
                  <input type="radio" name="graduationMonth" value="04" aria-label="April" required />
                  <span>Apr</span>
                </label>
                <label class="graduation-month">
                  <input type="radio" name="graduationMonth" value="05" aria-label="May" required />
                  <span>May</span>
                </label>
                <label class="graduation-month">
                  <input type="radio" name="graduationMonth" value="06" aria-label="June" required />
                  <span>Jun</span>
                </label>
                <label class="graduation-month">
                  <input type="radio" name="graduationMonth" value="07" aria-label="July" required />
                  <span>Jul</span>
                </label>
                <label class="graduation-month">
                  <input type="radio" name="graduationMonth" value="08" aria-label="August" required />
                  <span>Aug</span>
                </label>
                <label class="graduation-month">
                  <input type="radio" name="graduationMonth" value="09" aria-label="September" required />
                  <span>Sep</span>
                </label>
                <label class="graduation-month">
                  <input type="radio" name="graduationMonth" value="10" aria-label="October" required />
                  <span>Oct</span>
                </label>
                <label class="graduation-month">
                  <input type="radio" name="graduationMonth" value="11" aria-label="November" required />
                  <span>Nov</span>
                </label>
                <label class="graduation-month">
                  <input type="radio" name="graduationMonth" value="12" aria-label="December" required />
                  <span>Dec</span>
                </label>
              </div>
            </fieldset>
            <label
              >Bio <span class="subtle">(optional)</span
              ><textarea name="bio" maxlength="400"></textarea></label
            ><button class="primary wide">Save profile →</button>
            <p id="cancelEdit" hidden><a href="/settings">Cancel</a></p>
          </form>
        </section>
      </div>
    </main>
    <div id="toast" role="status"></div>
    <script src="/js/vendor/supabase.js"></script>
    <script type="module" src="/js/pages/profile.js"></script>
  </body>
</html>
